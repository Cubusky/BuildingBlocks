name: '📝 Formatting check'
on:
  push:
  pull_request:
    
jobs:
  formatting_check:
    name: '📝 Formatting check'
    # Only run the workflow if it's not a PR or if it's a PR from a fork.
    # This prevents duplicate workflows from running on PR's that originate
    # from the repository itself.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '.'
    steps:
      - uses: actions/checkout@v6
      
      - name: Check formatting
        id: csharpier
        continue-on-error: true
        run: |
          dotnet tool restore
          dotnet csharpier check . 2>&1 | tee csharpier-report.txt

      - name: Publish formatting report
        if: always()
        run: |
          echo "## Formatting check report" >> "$GITHUB_STEP_SUMMARY"
          cat csharpier-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if formatting is not correct
        if: steps.csharpier.outcome == 'failure'
        run: exit 1